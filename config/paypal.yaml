# Config for the PayPal review tab (`/paypal`) — reviewing unapproved
# transactions on the Paypal YNAB account, enriched with the linked PayPal
# CSV note. Scoped strictly to that one account; Target/Amazon/etc never
# appear here. See CONTEXT.md for what a "Source" is and why each one gets
# its own module instead of a shared engine.

# Categories offered in the review dropdown. Shared across all sources
# (Target, Costco, PayPal) — same list as config/rules.yaml's
# allowed_categories and config/rules_costco.yaml's allowed_categories, so
# every source can target any category any of them needs.
# config/categories.json is a raw YNAB dump that also includes credit-card
# payment categories and transfer categories, none of which belong here.
# If you add a category here, add it to the other two files as well.
paypal_categories:
  - 'Activities'
  - 'Beauty'
  - 'Big Home Purchases'
  - 'Charity'
  - 'Chloe'
  - 'Daycare'
  - 'Eating Out'
  - 'Electric Bill'
  - 'Gas & Parking'
  - 'Gifts'
  - 'Groceries'
  - 'Health'
  - 'Home Decor'
  - 'Home Supplies'
  - 'Insurance'
  - 'Joseph'
  - 'Loans'
  - 'Maintenance'
  - 'Mang'
  - 'Missions'
  - 'Mortgage'
  - 'Nathanael'
  - 'One Offs'
  - 'Personal Care'
  - 'Property Tax'
  - 'Reimbursables'
  - 'Rent'
  - 'Savings'
  - 'Staff Fund'
  - 'Subscriptions'
  - 'Taxes'
  - 'Thanksgiving Offering'
  - 'Tithe'
  - 'Tools'
  - 'Travel'
  - 'Treating Others'
  - 'Trips'
  - 'Utility Bill'

# Local "remembered" categorizations, keyed on the PayPal note/description
# text only — payee-name matching was removed, since a rule should describe
# what a payment was for, not who sent it. Use SINGLE quotes for patterns
# for the same reason documented in rules.yaml — \b in a double-quoted YAML
# string is a backspace escape, not a regex anchor.
#
# Hand-edit this list; the review UI no longer auto-appends rules on approve
# (it used to learn a payee-name pattern per approval, which doesn't fit a
# description-only model).
rules:
  - pattern: '\bgift\b'
    category: 'Gifts'
  - pattern: 'Young Oh'
    category: 'Gifts'
  - pattern: 'Childcare Voucher'
    category: 'Daycare'
  - pattern: 'DT Book'
    category: 'Activities'
  - pattern: 'Childcare Funds'
    category: 'Daycare'

# Same conventions as rules.yaml: case-insensitive, UNANCHORED past a
# leading \b, first-match-wins. Use SINGLE quotes for every pattern — in
# double-quoted YAML strings \b is parsed as a backspace escape (\x08),
# which compiles fine but never matches.
#
# Costco item names on In-Warehouse receipts are abbreviated, all-caps codes
# (e.g. "KLNX ULTR", "KS ORG STOCK") rather than full product names — build
# these rules up against real imported receipts, not guessed in advance.
#
# Verify changes with: uv run pytest tests/test_rules_costco_config.py
rules:
  - pattern: '^Costco Gas'
    category: 'Gas & Parking'
    note: 'gas station receipts — line item is synthesized as "Costco Gas - <grade>"'
fallback_category: 'Groceries'

# Shared across all sources (Target, Costco, PayPal) — same list as
# config/rules.yaml's allowed_categories and config/paypal.yaml's
# paypal_categories, so every source can target any category any of them
# needs. Every rule category and fallback_category above must appear here.
# If you add a category here, add it to the other two files as well.

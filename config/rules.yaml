# Patterns are case-insensitive, UNANCHORED past their leading \b, and
# first-match-wins (the first rule whose pattern matches an item name wins,
# regardless of what else matches later in the list).
#
# Use SINGLE quotes for every pattern. In double-quoted YAML strings, \b is
# parsed as a backspace escape character (\x08), which silently produces a
# regex that compiles fine but never matches anything.
#
rules:
  - pattern: '\bdish\s+(?:soap|detergent)\b|\bdishwashing\b'
    category: 'Home Supplies'
  - pattern: '\btoiletwand\b|\btoilet\s+cleaning\b|\bcleaning\s+wand\b'
    category: 'Home Supplies'
  - pattern: '\btoilet spray\b|\bbathroom spray\b'
    category: 'Personal Care'
  - pattern: '\bstarbucks\b|\bcold brew\b|\biced coffee\b'
    category: 'Eating Out'
  - pattern: '\bcradle cap\b'
    category: 'Nathanael'
  - pattern: '\bface wash\b|\bface cleanser\b|\bfacial cleanser\b'
    category: 'Personal Care'
  - pattern: '\bpackaging tape\b|\bpacking tape\b|\bmoving box(?:es)?\b'
    category: 'Home Supplies'
  - pattern: '\btoothpaste\b|\btoothcare\b|\bmouthwash\b|\bfloss\b'
    category: 'Personal Care'
  - pattern: '\bmakeup remover\b|\bmicellar water\b'
    category: 'Personal Care'
  - pattern: '\brinse aid\b'
    category: 'Home Supplies'
  - pattern: '\bwrapping paper\b|\bgift bags?\b|\bgift tags?\b'
    category: 'Gifts'
  - pattern: '\bToddler\s+Girl'
    category: 'Chloe'
    note: 'girl clothes'
  - pattern: '\bdiapers?\b|\bbaby\s+wipes?\b|\bsimilac\b|\benfamil\b|\binfants?\b|\b(?:baby|toddler)\s+formula\b'
    category: 'Nathanael'
  - pattern: '\bpillow|\bsheets?\b|\bblankets?\b|\bbedding\b|\btowels?\b|\bbath|\bnapkins?\b'
    category: 'Home Supplies'
  - pattern: '\bshampoos?\b|\bsoaps?\b|\blotions?\b|\bdeodorants?\b|\bhair'
    category: 'Personal Care'
  - pattern: '\bchairs?\b|\btables?\b|\blamps?\b|\bshel(?:f|ves)\b|\borganizers?\b|\bstorage\b'
    category: 'Home Decor'
  - pattern: '\bbugs?\b|\binsect|\brepellents?\b|\bsprays?\b|\bpests?\b'
    category: 'Home Supplies'
  - pattern: '\bToddler\s+Boys|\bBaby\s+Boys\b'
    category: 'Nathanael'
  - pattern: '\bEye Drops'
    category: 'Personal Care'
  - pattern: '\bmilks?\b|\b(?:whipped|sour|heavy|coffee)\s+creams?\b|\bcreamy\b|\bcreamers?\b|\bblueberr|\braspberr|\bham\b|\bhamburgers?\b|\bbreaded\b|\bbuttermilk\b|\bbiscuits?\b|\bsyrups?\b|\bnutella\b|\bgrocer|\bproduce\b|\bbread\b|\bsnacks?\b'
    category: 'Groceries'
fallback_category: 'Groceries'

# Shared across all sources (Target, Costco, PayPal) — the same list is
# duplicated verbatim in config/rules_costco.yaml's allowed_categories and
# config/paypal.yaml's paypal_categories, so every source can target any
# category any of them needs. Every visible, non-account YNAB category:
# everything in config/categories.json except the "Credit Card Payments"
# group (one payment category per account — 'account' below), the
# "Internal Master Category" group (Inflow: Ready to Assign, Deferred
# Income SubCategory, Uncategorized — YNAB system bookkeeping, not spend
# categories), and anything individually hidden in YNAB (e.g. Clothes/Shoes
# — hidden because it's unused, so it's excluded here too).
#
# Every rule category and fallback_category above must appear here.
# Enforced by the rule-editing validator (ynab_helper.rules_editor) and by
# tests/test_rules_config.py. If you add a category here, add it to the
# other two files as well. Re-derive from `sync-categories` output if the
# YNAB category list changes.
allowed_categories:
  - 'Activities'
  - 'Beauty'
  - 'Big Home Purchases'
  - 'Charity'
  - 'Chloe'
  - 'Daycare'
  - 'Eating Out'
  - 'Electric Bill'
  - 'Gas & Parking'
  - 'Gifts'
  - 'Groceries'
  - 'Health'
  - 'Home Decor'
  - 'Home Supplies'
  - 'Insurance'
  - 'Joseph'
  - 'Loans'
  - 'Maintenance'
  - 'Mang'
  - 'Missions'
  - 'Mortgage'
  - 'Nathanael'
  - 'One Offs'
  - 'Personal Care'
  - 'Property Tax'
